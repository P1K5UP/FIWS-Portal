.champion-more summary{width:max-content;max-width:100%;cursor:pointer;color:var(--acc);font:700 .78rem 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase}
.champion-stat-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.55rem;margin-top:.7rem}
.champion-stat-grid>div{display:grid;gap:.08rem;padding:.55rem .65rem;border:1px solid var(--line);border-radius:7px;background:color-mix(in srgb,var(--champ-gold) 5%,var(--panel))}
.champion-stat-grid b{font:700 1.15rem 'Barlow Condensed';font-variant-numeric:tabular-nums}
.champion-stat-grid small{font-size:.65rem;line-height:1.2;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
@keyframes champion-reveal{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes champion-cup-in{from{opacity:0;transform:scale(.72) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0)}}
.entries-filter-tools{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(150px,.8fr) minmax(160px,.8fr);gap:.65rem;align-items:end;min-width:0}
.entries-filter-tools label{display:grid;gap:.3rem;min-width:0}
.entries-filter-tools label>span{font:700 .72rem 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.entries-filter-tools input,.entries-filter-tools select{min-height:43px;width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:.55rem .7rem;color:var(--ink);font:500 .95rem Barlow}
.entries-results-line{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.6rem .1rem .4rem;color:var(--mute);font-size:.82rem}
.entries-reset{border:0;background:none;color:var(--acc);font:700 .8rem 'Barlow Condensed';text-transform:uppercase;letter-spacing:.06em;cursor:pointer;padding:.35rem}
.entry-member[hidden],.entry-team-card[hidden]{display:none!important}
.application-heading,.application-panel,.entries-directory,.home-championship{transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.application-heading:hover,.application-panel:hover{box-shadow:0 20px 42px -32px var(--shadow-color)}
@media(max-width:700px){.entries-filter-tools{grid-template-columns:1fr 1fr}.entries-filter-tools .entries-quick-search{grid-column:1/-1}.champion-stat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.champion-more{grid-column:1/-1}.entries-results-line{align-items:flex-start}.entries-reset{white-space:nowrap}}
@media(max-width:480px){.champion-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.entries-filter-tools{grid-template-columns:1fr}.entries-filter-tools .entries-quick-search{grid-column:auto}}
@media(prefers-reduced-motion:reduce){.champion-card,.champion-cup,.application-heading,.application-panel,.entries-directory,.home-championship{animation:none!important;transition:none!important}}
</style></head><body>

/*PARSE*/
function parseWB(wb){
 const res=[];const num=v=>typeof v==='number'&&isFinite(v)?v:(typeof v==='string'&&v.trim()!==''&&isFinite(+v)?+v:null);
 const iso=v=>v instanceof Date?new Date(v.getTime()+432e5).toISOString().slice(0,10):(v==null?'':String(v).trim());
 const tc=s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
 for(const sn of wb.SheetNames){
  const g=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
  const cell=(r,c)=>{const v=(g[r]||[])[c];return v===undefined?null:v};
  const blank=v=>v==null||(typeof v==='string'&&!v.trim());
  const W=Math.max(1,...g.map(r=>r.length));
  const seasons=[],secs=[];
  (g[1]||[]).forEach((v,c)=>{if(typeof v==='string'&&v.trim())seasons.push({c,t:v.trim()})});
  (g[4]||[]).forEach((v,c)=>{if(typeof v==='string'&&v.trim())secs.push({c,n:v.trim().toUpperCase()})});
  const S={};
  secs.forEach((s,i)=>{s.end=i+1<secs.length?secs[i+1].c:W;
   const se=[...seasons].reverse().find(x=>x.c<=s.c);if(!se)return;
   const m=se.t.match(/SEASON\s+(\S+)\s*(?:\((\w+)\))?/i);
   const o=S[se.c]||(S[se.c]={key:sn+':'+se.c,sheet:sn,series:tc(se.t.replace(/\s*SEASON.*$/i,'')),num:m?m[1].toUpperCase():String(se.c),status:m&&m[2]?m[2].toUpperCase():'',sec:{}});
   o.sec[s.n]=s});
  const table=(c,end,hr)=>{const H=[];for(let k=c;k<end;k++){const h=cell(hr,k);H.push(typeof h==='string'&&h.trim()?h.trim():null)}
   const rows=[];let r=hr+1;while(r<g.length&&!blank(cell(r,c))){const o={_r:r};H.forEach((h,i)=>{if(h)o[h]=cell(r,c+i)});rows.push(o);r++}
   return{rows,next:r}};
  Object.values(S).forEach(o=>{
   const entryKey=Object.keys(o.sec).find(k=>/^ENTRIES(?:\s*(?:\(\s*CONFIRMED\s*\)|[-–:]\s*CONFIRMED))?$/i.test(k));
   const E=entryKey?o.sec[entryKey]:null,C=o.sec['CALENDAR'],R=o.sec['STANDINGS (RACE BY RACE)'],P=o.sec['STANDINGS (POINTS)'];
   o.entriesConfirmed=!!entryKey&&/CONFIRMED/i.test(entryKey);
   Object.assign(o,{drivers:[],teams:[],cal:[],res:[],codes:[],drv:[],con:[],done:-1});delete o.sec.__;
   if(E){const t=table(E.c,E.end,6);o.drivers=t.rows;let r=t.next;while(r<t.next+12&&cell(r,E.c)!=='Team')r++;if(cell(r,E.c)==='Team')o.teams=table(E.c,E.end,r).rows}
   if(C){const dateCol=(g[6]||[]).findIndex((v,c)=>c>=C.c&&c<C.end&&String(v??'').trim().toLowerCase()==='date');o.cal=table(C.c,C.end,6).rows.map((x,i)=>{const n=cell(x._r,C.c-1),dateCell=dateCol>=0?wb.Sheets[sn][XLSX.utils.encode_cell({r:x._r,c:dateCol})]:null,dateText=iso(x.Date),date=/ANN?UL+ED/i.test(String(dateCell?.w||''))&&!/ANN?UL+ED/i.test(dateText)?dateText+' ANNULED':dateText;return{n:typeof n==='number'?n:i,name:String(x.Rounds??''),circuit:x.Circuit||'',laps:x['Total Laps']??'',caution:x['Caution Speed']||'',date,notes:x.Notes||''}})}
   if(R){o.res=table(R.c,R.end,6).rows.map(x=>({...x,pole:x['Driver on Pole'],stage:x['Stage Winner'],win:x['Winning Driver'],p2:x['2nd Place Driver'],p3:x['3rd Place Driver'],team:x['Winning Team'],cautions:x.Cautions}))}
   if(P){for(let k=P.c+1;k<P.end&&typeof cell(6,k)==='string'&&cell(6,k).trim();k++)o.codes.push(cell(6,k).trim());
    const rowsOf=r0=>{const a=[];let r=r0;while(r<g.length&&!blank(cell(r,P.c))&&cell(r,P.c)!=='Constructors'&&cell(r,P.c)!=='Key'){a.push({name:String(cell(r,P.c)).trim(),vals:o.codes.map((_,i)=>num(cell(r,P.c+1+i)))});r++}return{a,r}};
    const d=rowsOf(7);o.drv=d.a;let r=d.r;while(r<d.r+8&&cell(r,P.c)!=='Constructors')r++;if(cell(r,P.c)==='Constructors')o.con=rowsOf(r+1).a;
    o.drv.forEach(d=>d.vals.forEach((v,i)=>{if(v!=null&&i>o.done)o.done=i}))}
   if(['UPCOMING','PLANNED','PRIVATE','UNCONFIRMED'].includes(o.status))o.status='FUTURE';
   if(['PAST','COMPLETE','COMPLETED'].includes(o.status))o.status='FINISHED';
   if(['LIVE','ACTIVE','CURRENT'].includes(o.status))o.status='ONGOING';
   if(!o.status){const dates=o.cal.map(c=>c.date).filter(d=>/^\d{4}-/.test(d)),today=new Date().toISOString().slice(0,10),past=dates.some(d=>d<today),future=dates.some(d=>d>=today);if(past&&future)o.status='ONGOING';else if(past&&o.done>=0)o.status='FINISHED';else if(future&&o.done<0)o.status='FUTURE'}
   o.entriesVisible=o.status==='FINISHED'||o.entriesConfirmed;
   delete o.sec;if(o.cal.length||o.drv.length||o.drivers.length)res.push(o)});
 }
 return res}
/*ENDPARSE*/

const LS={get(k,d){try{const v=localStorage.getItem('fiws.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('fiws.'+k,JSON.stringify(v));return true}catch{return false}},del(k){try{localStorage.removeItem('fiws.'+k)}catch{}}};
LS.del('theme');
let pendingReferenceCookie=null;
function saveReferenceCookie(code){pendingReferenceCookie=code;if(!LS.get('consent',null))return false;document.cookie='fiws_application_ref='+encodeURIComponent(code)+'; Max-Age=31536000; Path=/; SameSite=Strict'+(location.protocol==='https:'?'; Secure':'');return document.cookie.split('; ').some(x=>x.startsWith('fiws_application_ref='))}
function getReferenceCookie(){const item=document.cookie.split('; ').find(x=>x.startsWith('fiws_application_ref='));try{return item?decodeURIComponent(item.slice(item.indexOf('=')+1)):''}catch{return ''}}
function clearReferenceCookie(code=''){const current=getReferenceCookie();if(code&&current!==normRef(code))return false;document.cookie='fiws_application_ref=; Max-Age=0; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/; SameSite=Strict'+(location.protocol==='https:'?'; Secure':'');pendingReferenceCookie=null;return !getReferenceCookie()}
const clean=(s,m=200)=>String(s??'').normalize('NFKC').replace(/[\u0000-\u001F\u007F<>]/g,' ').replace(/\s+/g,' ').trim().slice(0,m);
const toast=t=>{const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)};
/* data */
let D=[],srcNote='bundled workbook';
function load(){let b=LS.get('xlsx',null);srcNote=b?'uploaded workbook':'bundled workbook';
 try{D=parseWB(XLSX.read(b||B64,{type:'base64',cellDates:true}))}catch(e){console.error(e);D=[];if(b){LS.del('xlsx');return load()}}}
const cur={series:'FIWS',key:null};
const isFutureSeason=s=>['FUTURE','UPCOMING','PLANNED','PRIVATE','UNCONFIRMED'].includes(String(s?.status||'').toUpperCase());
const publicSeasons=()=>D.filter(s=>!isFutureSeason(s));
const series=()=>[...new Set(publicSeasons().map(s=>s.sheet))];
const defKey=sh=>{const l=publicSeasons().filter(s=>s.sheet===sh);return(l.find(s=>s.status==='ONGOING')||[...l].reverse().find(s=>s.status==='FINISHED')||[...l].reverse().find(s=>s.done>=0)||l[0]||{}).key};
const seas=()=>publicSeasons().find(s=>s.key===cur.key)||publicSeasons().find(s=>s.sheet===cur.series)||publicSeasons()[0];
const stl={FINISHED:'Complete',ONGOING:'Live',FUTURE:'Upcoming'};

<p class="muted" style="max-width:70ch;margin:.65rem 0 1.2rem">A clear guide to racing fairly in FIWS and FITC. These rules apply to every driver. Event-specific instructions from the race director or stewards take priority where stated.</p>
<div class="rules-grid">
<section class="panel rule-intro"><span class="chip nx">The essentials</span><h2>Race hard. Race fair.</h2><p>Respect other drivers, follow race control instructions, stay on track and never put another competitor at risk. Deliberate contact, road rage and exploiting game glitches are not acceptable.</p><div class="rule-pills"><span>Be predictable</span><span>Leave racing room</span><span>Respect the stewards</span></div></section>
<details class="panel rule-section" open><summary><span class="rule-no">01</span><span><b>Before the race & the start</b><small>Formation lap, rolling starts and pitlane</small></span></summary><div class="rule-body"><ul>
<li>Every driver must take part in the formation lap. Do not overtake during the formation lap or while under caution.</li>
<li>After the formation lap, form up two-by-two behind the leaders, in qualifying order. Follow the cars ahead closely and hold your position.</li>
<li>The pole-sitter controls the rolling start. Do not accelerate or overtake until the field begins accelerating.</li>
<li>Before the restart, the leader must bring the field below <b>120 km/h (75 mph) in FIWS</b> or <b>80 km/h (50 mph) in FITC</b>.</li>
<li>Only the leader and the car alongside need to be in the restart zone. The zone runs from the final-corner exit to the start/finish line.</li>
<li>If the formation, speed or start procedure is not followed, the start is aborted and attempted again on the first lap until successful. The pitlane stays closed until the race has started.</li>
</ul></div></details>
<details class="panel rule-section"><summary><span class="rule-no">02</span><span><b>Driving standards & racecraft</b><small>Impeding, overtaking, defending and racing room</small></span></summary><div class="rule-body">
<h3>Respect other drivers</h3><ul><li>Road rage, deliberate wrecking and intentionally cutting the course are prohibited.</li><li>Leave at least one car's width when a rival is alongside. Do not force another car off the track.</li><li>Do not move under braking. Be predictable, especially when defending or rejoining.</li><li>The current FIWS directive allows <b>one change of direction</b> when defending. A second or reactive move is illegal blocking and may be penalised.</li></ul>
<h3>Overtaking</h3><ul><li>On ovals, the “ahead at the apex” rule applies: if you are ahead at the apex, the corner is yours. Any move by the car behind is at their own risk.</li><li>On road courses, overtakes must be made safely. Do not dive into gaps that are not there.</li><li>Do not use the ahead-at-apex rule to squeeze or push another driver beyond track limits. Forcing a car off track is a serious offence.</li></ul>
<h3>Impeding</h3><p>Do not block or interfere with another driver's lap. This includes sitting on their racing line, attempting to pass them, defending against them or making contact while they are on a lap.</p><p>If asked to move aside, do so promptly and predictably: on a straight, move well clear of the racing line and slow significantly; in a corner, move safely off the line (usually to the outside) and slow almost to a stop. Dangerous moves or refusing to move may be penalised.</p>
</div></details>
<details class="panel rule-section"><summary><span class="rule-no">03</span><span><b>Track limits, pitstops & reversing</b><small>Stay on the circuit and make a legal stop</small></summary><div class="rule-body"><ul>
<li>On road courses, the track ends at the end of the kerb. If more than two wheels go beyond it and you gain an advantage, a penalty will be issued.</li>
<li>On ovals, the track limit is normally the bottom white or yellow line. Any event-specific exceptions will be explained before the race. Stewards or race control will clarify grey areas; if unsure, do not push it.</li>
<li>Cutting the pitlane is strictly prohibited.</li>
<li>Every driver must complete one mandatory pitstop in each race. <b>Tyres only</b> are required.</li>
<li>A pitstop will not count if you speed on entry, fail to complete the full pitlane distance, enter incorrectly or crash in the pitlane.</li>
<li>Reversing on track is allowed only to correct an overshot pitbox, escape a run-off area or free yourself from a barrier. Never reverse to gain an advantage.</li>
<li>Celebrations are allowed after you finish, provided you stay clear of drivers still racing.</li>
</ul></div></details>
<details class="panel rule-section"><summary><span class="rule-no">04</span><span><b>Cautions & race restarts</b><small>What to do when an incident brings out a caution</small></summary><div class="rule-body"><ul>
<li>Slow to the caution speed announced for that track. Do not overtake cars ahead unless a car has a serious problem and is clearly letting you pass.</li>
<li>The pitlane is open during a caution. You may pass cars on track when entering the pitlane, but must obey caution speed.</li>
<li>If you crash or have a problem, report it in voice chat. Follow caution procedure; a present steward has the final say on confirming a caution. Calling or exploiting a caution for personal gain may bring serious penalties.</li>
<li>Field order is based on the order drivers leave the incident. Drivers involved in or responsible for the caution rejoin wherever they end up when returning to the track.</li>
<li>Lapped cars may safely unlap themselves, but may do so no more than twice per caution. If they have not reached the back of the field by the end of the caution, the leaders may restart.</li>
<li>A mandatory mid-race caution applies to every driver. Slow to caution speed and follow the same rules. The pitlane closes one lap before it.</li>
</ul>
<h3>Repeated incidents</h3><ul><li>If the field cannot complete three consecutive restarts because a caution is called three times in the first two laps, the race switches permanently to a single-file restart.</li><li>If 12 crash-caused cautions occur, the race is red-flagged. The result is taken from before the caution and half points are awarded.</li></ul></div></details>
<details class="panel rule-section"><summary><span class="rule-no">05</span><span><b>Race participation & communication</b><small>Attendance, voice chat and race distance</small></summary><div class="rule-body"><ul>
<li>Every driver must be in voice chat and able to speak during events.</li>
<li>Complete at least <b>80% of the race distance</b> to avoid being classified as a DNF.</li>
<li>Reverse Gear Glitch abuse is strictly prohibited in FITC.</li>
</ul></div></details>
<details class="panel rule-section"><summary><span class="rule-no">06</span><span><b>Stewarding & penalties</b><small>How incidents are reviewed and sanctions applied</small></summary><div class="rule-body"><p>Stewards may review reported incidents after a race. Penalties are based on severity and may escalate for repeat offences, regardless of driver seniority.</p><ul>
<li><b>Time penalty:</b> 0.5–5 seconds, depending on severity.</li><li><b>Drive-through penalty.</b></li><li><b>Stop-and-go:</b> 5 or 10 seconds.</li><li><b>Penalty points.</b></li><li><b>Championship-points deduction:</b> taken from race results only.</li><li><b>Driver Rating reduction:</b> 1–5 points.</li>
</ul><p>Drive-through and stop-and-go penalties must be served under green-flag conditions. Serious or repeated breaches may also lead to qualifying bans, grid demotions, race suspensions or permanent expulsion.</p>
<h3>Penalty points</h3><ul><li>Penalty points may be awarded after a race for reported incidents.</li><li>At <b>12 penalty points</b>, a driver receives a one-race ban and their penalty-point total resets.</li><li>Penalty points are cleared at the end of each season.</li></ul>
<h3>Driver Rating (DR)</h3><ul><li>Every driver starts Formula Imperial with <b>200 DR</b>.</li><li>Complete a race and receive <b>+5 DR</b>.</li><li>If found guilty of an incident, lose <b>0.5–5 DR</b>, depending on severity.</li></ul></div></details>
<details class="panel rule-section"><summary><span class="rule-no">07</span><span><b>Season 2 points & playoffs</b><small>How championship points and the title are decided</small></span></summary><div class="rule-body"><h3>Playoff scoring</h3><ul><li>The regular season ends after <b>Round 18</b>. The top four drivers qualify for the playoffs.</li><li>Each qualifier starts the playoff phase on <b>500 points</b>.</li><li>Playoff drivers receive <b>+2 points for each race win</b> and <b>+0.5 points for each stage win</b> across the entire season.</li><li>Points earned in <b>R19 to R23</b> are added to each qualifier&#39;s playoff total. The driver with the most points after R23 wins the championship.</li></ul><p class="tbl-note">Playoff totals combine the 500-point start, season-wide race-win and stage-win bonuses, and points earned in R19–R23.</p></div></details>
<div class="panel rule-footer"><b>Questions or unsure about a situation?</b><p class="muted">Ask the race director or a steward before the session. Follow event briefings and official steward instructions. These standards apply to all drivers.</p></div>
</div>`,after:()=>{}});

 const tags=new Set(['svg','g','path','rect','circle','ellipse','line','polyline','polygon','defs','linearGradient','radialGradient','stop','clipPath','mask','title']);

  if(!tags.has(node.localName)){node.remove();return}

   const n=a.name,v=a.value.trim();

   if(n==='xmlns'&&v!=='http://www.w3.org/2000/svg'){node.removeAttribute(n);return}
   if(n==='d'&&!/^[MmLlHhVvCcSsQqTtAaZz0-9eE, .+-]*$/.test(v)){node.removeAttribute(n);return}
   if(n==='points'&&!/^[0-9eE, .+-]*$/.test(v)){node.removeAttribute(n);return}
   if(n==='transform'&&!/^[A-Za-z0-9(), .+-]*$/.test(v)){node.removeAttribute(n);return}
   if(['fill','stroke','stop-color'].includes(n)&&!/^url\(#[A-Za-z_][\w.-]*\)$/.test(v)&&!/^#[0-9a-fA-F]{3,8}$/.test(v)&&!/^[A-Za-z]+$/.test(v)&&!/^rgba?\([0-9.,% ]+\)$/.test(v)){node.removeAttribute(n);return}
   if(['width','height','x','y','x1','x2','y1','y2','cx','cy','r','rx','ry','opacity','fill-opacity','stroke-opacity','stroke-width','offset','stop-opacity'].includes(n)&&!/^[0-9.eE%+-]+$/.test(v)){node.removeAttribute(n);return}
  });
 });

}

(()=>{

 function launchSecretConfetti(){
  const canvas=document.createElement('canvas');canvas.className='fiws-secret-confetti';canvas.setAttribute('aria-hidden','true');
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');if(!ctx){canvas.remove();return}
  const dpr=Math.min(window.devicePixelRatio||1,2),w=window.innerWidth,h=window.innerHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const colors=['#00AEEF','#E53945'],count=reduced?30:86;
  const pieces=Array.from({length:count},()=>({
   x:w*(.12+Math.random()*.76),y:-20-Math.random()*h*.35,
   vx:reduced?0:(Math.random()-.5)*5,vy:reduced?0:2+Math.random()*5,
   spin:Math.random()*Math.PI,turn:reduced?0:(Math.random()-.5)*.22,
   size:4+Math.random()*6,color:colors[Math.floor(Math.random()*colors.length)],
   circle:Math.random()>.55
  }));
  const start=performance.now(),duration=reduced?700:1450;
  function frame(now){
   const progress=Math.min(1,(now-start)/duration);ctx.clearRect(0,0,w,h);
   pieces.forEach(p=>{
    if(!reduced){p.x+=p.vx;p.y+=p.vy;p.vy+=.075;p.spin+=p.turn}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.spin);ctx.globalAlpha=1-progress*.9;ctx.fillStyle=p.color;
    if(p.circle){ctx.beginPath();ctx.arc(0,0,p.size*.48,0,Math.PI*2);ctx.fill()}
    else ctx.fillRect(-p.size*.5,-p.size*.7,p.size,p.size*1.4);
    ctx.restore();
   });
   if(progress<1)requestAnimationFrame(frame);else canvas.remove();
  }
  requestAnimationFrame(frame);
 }
