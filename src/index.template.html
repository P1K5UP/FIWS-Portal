/* shared Supabase integration */
async function initSupabase(){
 if(!sb)throw new Error('Supabase client library did not load.');
 const {data,error}=await sb.auth.getSession();if(error)throw error;
 authSession=data.session;authUser=data.session?.user||null;
 sb.auth.onAuthStateChange((event,session)=>{
  authSession=session;authUser=session?.user||null;
  if(event==='SIGNED_IN')setTimeout(async()=>{
   await finishPendingApplication();
   if(location.hash==='#status')renderStatus();
   if(location.hash==='#admin')admin();
  },0);
  if(event==='SIGNED_OUT')setTimeout(()=>{
   if(location.hash==='#status')renderStatus();
   if(location.hash==='#admin')admin();
  },0);
 });
}
async function loadSharedData(){

 if(error)throw error;
 const cfg=Object.fromEntries((data||[]).map(x=>[x.setting_key,x.setting_value]));
 REMOTE_COLORS=cfg.team_colors&&typeof cfg.team_colors==='object'?cfg.team_colors:{};
 const logoPaths=cfg.logos&&typeof cfg.logos==='object'?cfg.logos:{};
 REMOTE_LOGOS={};
 for(const k of ['FIWS','FITC'])if(logoPaths[k]){
  const {data:p}=sb.storage.from('fiws-public').getPublicUrl(logoPaths[k]);

async function fiwsAdminApi(action,payload={}){
 if(!adminToken)throw new Error('Administrator session expired. Sign in again.');
 const response=await fetch(SUPABASE_URL+'/functions/v1/fiws-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'x-fiws-session':adminToken},body:JSON.stringify({action,...payload})});
 const result=await response.json().catch(()=>({error:'Invalid server response.'}));
 if(!response.ok)throw new Error(result.error||('Administrator request failed ('+response.status+').'));
 return result;
}
async function adminUploadFile(file,path,contentType){
 const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
 return fiwsAdminApi('asset-upload',{path,content_type:contentType,base64:btoa(binary)});
}

function authErrorDetails(err){
 const parts=[];
 const message=String(err?.message||err?.error_description||err||'Unknown authentication error');
 parts.push(message);
 const code=err?.code||err?.error_code||err?.name;
 if(code&&code!==message)parts.push('Code: '+code);
 if(err?.status)parts.push('HTTP status: '+err.status);
 if(err?.hint)parts.push('Hint: '+err.hint);
 if(/rate limit|email rate limit/i.test(message))parts.push('Supabase has temporarily limited email sending. Stop retrying and wait for the limit to reset, or configure custom SMTP.');
 if(/expired|invalid.*link/i.test(message))parts.push('Request a fresh sign-in email and use only the newest link. Check that the redirect URL is allowlisted in Supabase.');
 return parts.join(' · ');
}
function showAuthRedirectError(){
 const p=new URLSearchParams(location.hash.slice(1));
 const code=p.get('error_code')||p.get('error');
 if(!code)return;
 const banner=document.createElement('section');
 banner.className='panel';banner.setAttribute('role','alert');banner.style.cssText='margin:1rem 0;border:1px solid var(--red,#d44);';
 const heading=document.createElement('h2');heading.textContent='Sign-in link error';
 const msg=document.createElement('p');msg.textContent=p.get('error_description')||p.get('error')||'Authentication could not be completed.';
 const meta=document.createElement('p');meta.className='muted';meta.textContent='Error code: '+code+(p.get('sb')?' · Provider: '+p.get('sb'):'');
 const advice=document.createElement('p');advice.textContent=/expired|otp_expired|access_denied/i.test(code)?'The link may have expired or already been used. Request a new link after the email limit resets.':'Return to the page where you requested the link and try again after checking the details above.';
 const close=document.createElement('button');close.className='btn sm ghost';close.type='button';close.textContent='Dismiss';close.onclick=()=>banner.remove();
 banner.append(heading,msg,meta,advice,close);
 const main=document.querySelector('#main');if(main)main.prepend(banner);
}
async function emailSignIn(email,target,createUser){

 const {error}=await sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:redirect,shouldCreateUser:!!createUser}});
 if(error)throw error;
}
const pendingDraftKey='fiws.pendingApplication';
async function persistApplication(draft){
 const {data,error:userError}=await sb.auth.getUser();if(userError)throw userError;
 const user=data.user;if(!user||!user.email_confirmed_at)throw new Error('Verify your email before submitting.');
 const payload={...draft.data,type:draft.type,mail:!!draft.mail,email:user.email};
 const code=ref();
 const {data:submitData,error:submitError}=await sb.functions.invoke('submit-application',{body:{applicant_id:user.id,reference_code:code,application_data:payload}});
 if(submitError)throw submitError;if(submitData?.error)throw new Error(submitData.error);
 sessionStorage.removeItem(pendingDraftKey);
 LS.set('myref',code);
 return {code:code,payload:payload};
}
function applicationReceipt(result){
 const box=$('#box');if(!box)return;
 box.innerHTML='<h2>Application received</h2><p>Your reference code:</p><p class="disp" style="font-size:2.4rem;color:var(--acc)">'+esc(result.code)+'</p><p class="muted">Your application is securely stored. Sign in with the same verified email on any device to check its status.</p><div class="row"><a class="btn" href="#status">Check status</a><button class="btn ghost" id="cp" type="button">Copy reference code</button></div>';
 $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(result.code);toast('Reference code copied')}catch{toast('Copy unavailable. Your code is '+result.code)}};
}
async function finishPendingApplication(){
 const raw=sessionStorage.getItem(pendingDraftKey);if(!raw||!authUser)return;
 let draft;try{draft=JSON.parse(raw)}catch{sessionStorage.removeItem(pendingDraftKey);return}
 if(String(authUser.email||'').toLowerCase()!==String(draft.data?.email||'').toLowerCase())return;
 try{
  const result=await persistApplication(draft);
  if(location.hash==='#apply')applicationReceipt(result);else toast('Your application has been submitted.');
 }catch(e){console.error(e);toast(e.message||'Application could not be submitted.');}
}

async function admin(){

  $('#admin-login').onsubmit=async e=>{

    const response=await fetch(SUPABASE_URL+'/functions/v1/fiws-admin',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({action:'login',username:clean(f.username.value,32).toLowerCase(),password:f.password.value,otp:f.otp.value})});

     $('#mfa-confirm').onsubmit=async ev=>{ev.preventDefault();const form=ev.target,out=$('#mfa-error'),button=$('button',form);button.disabled=true;try{const done=await fiwsAdminApi('mfa-confirm',{otp:form.otp.value});adminIdentity=done.admin;R.innerHTML='<div class="panel"><h3>Save your recovery codes</h3><p>Each code works once. Store these somewhere safe; they will not be shown again.</p><pre style="white-space:pre-wrap;user-select:all">'+esc(done.recovery_codes.join('\n'))+'</pre><button class="btn" id="continue-admin">Continue to Admin</button></div>';$('#continue-admin').onclick=()=>adminLoad()}catch(x){out.textContent=x.message}finally{button.disabled=false}};
     return;

   }catch(x){err.textContent=x.message||'Sign-in failed.'}finally{btn.disabled=false}
  };

function sanitizeSvgSource(source){
 if(/<!DOCTYPE|<!ENTITY/i.test(source))throw new Error('SVG document types and entities are not allowed.');
 const doc=new DOMParser().parseFromString(source,'image/svg+xml');
 if(doc.querySelector('parsererror')||doc.documentElement.localName!=='svg')throw new Error('Invalid SVG file.');
 const tags=new Set(['svg','g','path','rect','circle','ellipse','line','polyline','polygon','defs','linearGradient','radialGradient','stop','clipPath','mask','title']);
 const attrs=new Set(['xmlns','viewBox','width','height','x','y','x1','x2','y1','y2','cx','cy','r','rx','ry','d','points','fill','fill-rule','fill-opacity','stroke','stroke-width','stroke-linecap','stroke-linejoin','stroke-opacity','opacity','transform','offset','stop-color','stop-opacity','gradientUnits','gradientTransform','clip-path','mask','id']);
 [doc.documentElement,...doc.documentElement.querySelectorAll('*')].forEach(node=>{
  if(!tags.has(node.localName)){node.remove();return}
  [...node.attributes].forEach(a=>{
   const n=a.name,v=a.value.trim();
   if(!attrs.has(n)||/^on/i.test(n)){node.removeAttribute(n);return}
   if((n==='clip-path'||n==='mask'||n==='fill'||n==='stroke')&&/url\(/i.test(v)&&!/^url\(#[A-Za-z_][\w.-]*\)$/.test(v)){node.removeAttribute(n);return}
   if(n==='xmlns'&&v!=='http://www.w3.org/2000/svg'){node.removeAttribute(n);return}
   if(n==='d'&&!/^[MmLlHhVvCcSsQqTtAaZz0-9eE, .+-]*$/.test(v)){node.removeAttribute(n);return}
   if(n==='points'&&!/^[0-9eE, .+-]*$/.test(v)){node.removeAttribute(n);return}
   if(n==='transform'&&!/^[A-Za-z0-9(), .+-]*$/.test(v)){node.removeAttribute(n);return}
   if(['fill','stroke','stop-color'].includes(n)&&!/^url\(#[A-Za-z_][\w.-]*\)$/.test(v)&&!/^#[0-9a-fA-F]{3,8}$/.test(v)&&!/^[A-Za-z]+$/.test(v)&&!/^rgba?\([0-9.,% ]+\)$/.test(v)){node.removeAttribute(n);return}
   if(['width','height','x','y','x1','x2','y1','y2','cx','cy','r','rx','ry','opacity','fill-opacity','stroke-opacity','stroke-width','offset','stop-opacity'].includes(n)&&!/^[0-9.eE%+-]+$/.test(v)){node.removeAttribute(n);return}
  });
 });
 const root=doc.documentElement;root.setAttribute('xmlns','http://www.w3.org/2000/svg');
 return new XMLSerializer().serializeToString(root);
}
async function sanitizeLogoToPng(file){
 let source;
 if(file.type==='image/svg+xml')source=sanitizeSvgSource(await file.text());
 else if(file.type!=='image/png'&&file.type!=='image/jpeg')throw new Error('Use PNG, JPG or SVG.');
 let url;
 try{
  const blob=source?new Blob([source],{type:'image/svg+xml'}):file;
  url=URL.createObjectURL(blob);const img=new Image();
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Image could not be decoded.'));img.src=url});
  const scale=Math.min(1,1200/img.naturalWidth,1200/img.naturalHeight),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
  const png=await new Promise(resolve=>c.toBlob(resolve,'image/png'));if(!png)throw new Error('Could not rasterize logo.');return png;
 }finally{if(url)URL.revokeObjectURL(url)}
}
function setLogo(){
 const k=cur.series,L=$('#logo'),T=$('.brand b');if(!L)return;
 L.innerHTML=mark;T.hidden=false;T.textContent=k;setIcon();
 const src=REMOTE_LOGOS[k]||((LS.get('logos',{})||{})[k])||LOGO[k]||LOGO.FIWS;
 if(!src)return;
 const img=new Image();if(/^https?:/.test(src))img.crossOrigin='anonymous';
 img.onload=()=>{
  if(cur.series!==k)return;
  try{
   const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
   const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
   const pixels=ctx.getImageData(0,0,canvas.width,canvas.height),p=pixels.data;
   const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
   for(let i=0;i<p.length;i+=4){
    if(!p[i+3])continue;const hi=Math.max(p[i],p[i+1],p[i+2]),lo=Math.min(p[i],p[i+1],p[i+2]);
    if(hi-lo>18)continue;const y=.2126*p[i]+.7152*p[i+1]+.0722*p[i+2];
    if(!dark&&y>=225){p[i]=p[i+1]=p[i+2]=0}
    else if(dark&&y<=30){p[i]=p[i+1]=p[i+2]=255}
   }
   ctx.putImageData(pixels,0,0);canvas.setAttribute('role','img');canvas.setAttribute('aria-label',k+' logo');canvas.style.maxWidth='200px';L.innerHTML='';L.append(canvas);T.hidden=true;
  }catch(e){console.warn('Logo theme processing unavailable',e)}
 };
 img.onerror=()=>{L.innerHTML=mark;T.hidden=false};img.src=src;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!document.documentElement.dataset.theme)setLogo()});
