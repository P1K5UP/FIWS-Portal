[hidden]{display:none!important}.dz>*{pointer-events:none}.dz{display:grid;place-items:center;gap:.2rem;text-align:center;padding:2rem 1rem;border:2px dashed var(--line);border-radius:8px;background:var(--soft);cursor:pointer;transition:border-color .2s,background .2s,transform .2s}.dz.on,.dz:hover{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,var(--soft))}.dz.on{transform:scale(1.01)}.dz b{font:700 1.4rem 'Barlow Condensed';text-transform:uppercase}.dz span{color:var(--mute);font-size:.9rem}.pw{height:5px;border-radius:3px;background:var(--line);overflow:hidden}.pw i{display:block;height:100%;width:0;background:var(--bad);transition:width .3s,background .3s}

<button class="skip btn" id="skip">Skip to content</button>
<header class="top"><div class="bar"><a class="brand" href="#home" aria-label="FIWS home"><span id="logo"></span><b>FIWS</b></a>

<main id="main" tabindex="-1"></main>
<footer class="ft"><div class="in"><span>© Formula Imperial Worldwide Series. Unofficial league data is shown as provided by league staff.</span><span><a href="#privacy">Privacy</a> &nbsp; <a href="#terms">Terms</a> &nbsp; <a href="#cookies">Cookies</a> &nbsp; <a href="#admin">Admin</a> &nbsp; <a href="#" id="cset">Cookie settings</a></span></div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(()=>{'use strict';
const LEAGUE_EMAIL=''; // set to the league inbox so applicants can send their application by email
const B64='__B64__';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
/*PARSE*/
function parseWB(wb){
 const res=[];const num=v=>typeof v==='number'&&isFinite(v)?v:(typeof v==='string'&&v.trim()!==''&&isFinite(+v)?+v:null);
 const iso=v=>v instanceof Date?new Date(v.getTime()+432e5).toISOString().slice(0,10):(v==null?'':String(v).trim());
 const tc=s=>s.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
 for(const sn of wb.SheetNames){
  const g=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
  const cell=(r,c)=>{const v=(g[r]||[])[c];return v===undefined?null:v};
  const blank=v=>v==null||(typeof v==='string'&&!v.trim());
  const W=Math.max(1,...g.map(r=>r.length));
  const seasons=[],secs=[];
  (g[1]||[]).forEach((v,c)=>{if(typeof v==='string'&&v.trim())seasons.push({c,t:v.trim()})});
  (g[4]||[]).forEach((v,c)=>{if(typeof v==='string'&&v.trim())secs.push({c,n:v.trim().toUpperCase()})});
  const S={};
  secs.forEach((s,i)=>{s.end=i+1<secs.length?secs[i+1].c:W;
   const se=[...seasons].reverse().find(x=>x.c<=s.c);if(!se)return;
   const m=se.t.match(/SEASON\s+(\S+)\s*(?:\((\w+)\))?/i);
   const o=S[se.c]||(S[se.c]={key:sn+':'+se.c,sheet:sn,series:tc(se.t.replace(/\s*SEASON.*$/i,'')),num:m?m[1].toUpperCase():String(se.c),status:m&&m[2]?m[2].toUpperCase():'',sec:{}});
   o.sec[s.n]=s});
  const table=(c,end,hr)=>{const H=[];for(let k=c;k<end;k++){const h=cell(hr,k);H.push(typeof h==='string'&&h.trim()?h.trim():null)}
   const rows=[];let r=hr+1;while(r<g.length&&!blank(cell(r,c))){const o={_r:r};H.forEach((h,i)=>{if(h)o[h]=cell(r,c+i)});rows.push(o);r++}
   return{rows,next:r}};
  Object.values(S).forEach(o=>{
   const E=o.sec['ENTRIES'],C=o.sec['CALENDAR'],R=o.sec['STANDINGS (RACE BY RACE)'],P=o.sec['STANDINGS (POINTS)'];
   Object.assign(o,{drivers:[],teams:[],cal:[],res:[],codes:[],drv:[],con:[],done:-1});delete o.sec.__;
   if(E){const t=table(E.c,E.end,6);o.drivers=t.rows;let r=t.next;while(r<t.next+12&&cell(r,E.c)!=='Team')r++;if(cell(r,E.c)==='Team')o.teams=table(E.c,E.end,r).rows}
   if(C){o.cal=table(C.c,C.end,6).rows.map((x,i)=>{const n=cell(x._r,C.c-1);return{n:typeof n==='number'?n:i,name:String(x.Rounds??''),circuit:x.Circuit||'',laps:x['Total Laps']??'',caution:x['Caution Speed']||'',date:iso(x.Date),notes:x.Notes||''}})}
   if(R){o.res=table(R.c,R.end,6).rows.map(x=>({pole:x['Driver on Pole'],stage:x['Stage Winner'],win:x['Winning Driver'],p2:x['2nd Place Driver'],p3:x['3rd Place Driver'],team:x['Winning Team'],cautions:x.Cautions}))}
   if(P){for(let k=P.c+1;k<P.end&&typeof cell(6,k)==='string'&&cell(6,k).trim();k++)o.codes.push(cell(6,k).trim());
    const rowsOf=r0=>{const a=[];let r=r0;while(r<g.length&&!blank(cell(r,P.c))&&cell(r,P.c)!=='Constructors'&&cell(r,P.c)!=='Key'){a.push({name:String(cell(r,P.c)).trim(),vals:o.codes.map((_,i)=>num(cell(r,P.c+1+i)))});r++}return{a,r}};
    const d=rowsOf(7);o.drv=d.a;let r=d.r;while(r<d.r+8&&cell(r,P.c)!=='Constructors')r++;if(cell(r,P.c)==='Constructors')o.con=rowsOf(r+1).a;
    o.drv.forEach(d=>d.vals.forEach((v,i)=>{if(v!=null&&i>o.done)o.done=i}))}
   delete o.sec;if(o.cal.length||o.drv.length||o.drivers.length)res.push(o)});
 }
 return res}
/*ENDPARSE*/
/* storage + consent */
const LS={get(k,d){try{const v=localStorage.getItem('fiws.'+k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem('fiws.'+k,JSON.stringify(v));return true}catch{return false}},del(k){try{localStorage.removeItem('fiws.'+k)}catch{}}};
const clean=(s,m=200)=>String(s??'').normalize('NFKC').replace(/[\u0000-\u001F\u007F<>]/g,' ').replace(/\s+/g,' ').trim().slice(0,m);
const toast=t=>{const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)};
/* data */
let D=[],srcNote='bundled workbook';
function load(){let b=LS.get('xlsx',null);srcNote=b?'uploaded workbook':'bundled workbook';
 try{D=parseWB(XLSX.read(b||B64,{type:'base64',cellDates:true}))}catch(e){console.error(e);D=[];if(b){LS.del('xlsx');return load()}}}
const cur={series:'FIWS',key:null};
const series=()=>[...new Set(D.map(s=>s.sheet))];
const defKey=sh=>{const l=D.filter(s=>s.sheet===sh);return(l.find(s=>s.status==='ONGOING')||[...l].reverse().find(s=>s.done>=0)||l[0]||{}).key};
const seas=()=>D.find(s=>s.key===cur.key)||D.find(s=>s.sheet===cur.series)||D[0];
const stl={FINISHED:'Complete',ONGOING:'Live',FUTURE:'Upcoming'};
const PAL=['#00AEEF','#E5484D','#F5A524','#2FB67C','#7B61FF','#E056A0','#8A9BA8','#0A5BA8'];
const TEAM_COLORS={}; // permanent overrides, e.g. {'Suaber':'#E5484D'}
let TCOL=LS.get('tcol',{})||{};const tcol=n=>TCOL[n]||TEAM_COLORS[n]||PAL[[...String(n)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7)%PAL.length];
const CC={Egypt:'EGY','United Kingdom':'GBR',Singapore:'SGP',Australia:'AUS',Germany:'GER',Romania:'ROU','Hong Kong':'HKG',Indonesia:'IDN',Switzerland:'SUI',International:'INT'};
const info=(s,n)=>{const e=s.drivers.find(d=>d.Driver===n);if(!e)return{team:'',num:'',nat:''};const t=String(e.Team||'').split(',').pop().replace(/\(.*?\)/g,'').trim();return{team:/^(N\/A|TBD)$/i.test(t)?'':t,num:e.Number||'',nat:CC[e.Nationality]||''}};
const valid=v=>v!=null&&String(v).trim()!==''&&!/^N\/A/i.test(String(v));
const fd=iso=>/^\d{4}-/.test(iso)?new Date(iso+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}):iso||'TBD';
const rLabel=(s,i)=>{const c=s.cal[i];return(c?'R'+c.n+' · '+c.name:'Round '+i)+(c&&/CANCEL/i.test(c.date)?' (cancelled)':'')};
const latest=s=>{for(let i=Math.min(s.done<0?s.res.length-1:s.done,s.res.length-1);i>=0;i--)if(valid(s.res[i].win))return i;return -1};
const cl=[];const cleanup=()=>{while(cl.length)cl.pop()()};
/* timing tower */
function tower(el,s,kind,limit){
 const list=kind==='con'?s.con:s.drv,n=Math.min(limit,list.length),H=44,max=Math.max(0,s.done);

const legal={privacy:['Privacy notice',`<p>This notice explains what the FIWS website does with personal data.</p><h3>What we collect</h3><ul><li><b>Applications:</b> the name, email, country, car number, team, racing experience and motivation you type into the form, plus a reference code and timestamp.</li><li><b>Preferences:</b> your last selected series and season, only if you accept preference storage.</li></ul><h3>Why and on what basis</h3><p>Application data is used only to assess and answer your application (legitimate interest and steps you request before joining). Emails about your decision are sent only if you tick the optional email box (consent). You can withdraw consent at any time by contacting league staff.</p><h3>Where it is stored</h3><p>This site has no tracking, analytics or advertising. Data you submit is stored in your browser's local storage on this device. If you email your application to league staff, they receive it through your email provider. Fonts are loaded from Google Fonts and the spreadsheet reader from cdnjs, so those providers receive your IP address when pages load.</p><h3>Retention and your rights</h3><p>Staff keep applications only as long as needed to run the season, then delete them. You may ask to access, correct or erase your data by contacting league staff. Clearing site data in your browser removes what this device holds.</p><h3>Security</h3><p>Input is length-limited and cleaned, output is escaped, and the admin panel is passcode-protected. No browser-only site can guarantee server-grade protection, so avoid including sensitive personal details in free-text fields.</p>`],
terms:['Terms of use',`<p>By using this site and applying to race you agree to these terms.</p><ul><li>League standings and results are published by league staff and may be corrected after steward decisions.</li><li>Applying does not guarantee an entry. Staff may accept or reject any application.</li><li>Entrants must follow the <a href="#rules">rules and driving standards</a> and steward rulings, and behave respectfully towards other drivers and staff.</li><li>Cars, brands, track names and logos belong to their owners and appear for identification. FIWS is an independent community league.</li><li>The site is provided as is, without warranty. Do not attempt to interfere with its operation or other users' data.</li></ul>`],
cookies:['Cookies & storage',`<p>FIWS sets no cookies. It uses your browser's local storage instead, in two groups:</p><ul><li><b>Necessary:</b> your consent choice, applications you submit and your latest reference code, admin sign-in state and any data or logo uploaded by staff. The site cannot work without these.</li><li><b>Preferences (optional):</b> your selected series and season. Stored only if you accept.</li></ul><p>There are no analytics, advertising or tracking technologies. Change your choice at any time:</p><button class="btn sm" id="cs">Open cookie settings</button>`]};
